name: Eksik Gecmisli Fonlar Teshis (Bir Kerelik)
on:
  workflow_dispatch: {}
jobs:
  teshis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklari kur
        run: pip install -r requirements.txt
      - name: Eksik gecmisli fonlari bul
        run: python scripts/diagnose_eksik_fonlar.py
