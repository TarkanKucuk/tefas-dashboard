name: Kontrol

on:
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli kütüphaneleri kur
        run: pip install pandas numpy pyarrow openpyxl

      - name: Export script'ini çalıştır (deneme)
        run: python scripts/export_fon_kartlari.py

      - name: Örnek çıktıyı göster (PBR)
        run: cat docs/data/fon-kartlari/PBR.json
