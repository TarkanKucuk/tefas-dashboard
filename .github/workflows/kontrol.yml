name: Kontrol

on:
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli kütüphaneleri kur
        run: pip install pandas pyarrow openpyxl

      - name: score_funds.py'yi simdi calistir ve sonucu kontrol et
        run: |
          python scripts/score_funds.py
          echo "--- docs/yeni-fonlar.html icinde KSP araniyor ---"
          if grep -q "KSP" docs/yeni-fonlar.html; then
            echo "SONUC: KSP HALA SAYFADA VAR -> bu bir KOD hatasi"
          else
            echo "SONUC: KSP artik sayfada YOK -> kod dogru calisiyor, onceki sorun eski/onbellek bir calistirmaydi"
          fi
