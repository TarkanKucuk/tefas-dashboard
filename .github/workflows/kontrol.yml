name: Kontrol

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli kütüphaneleri kur
        run: pip install pandas numpy pyarrow openpyxl borsapy

      - name: Benchmark verisini güncelle (boşlukları kapat)
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python scripts/update_benchmarks.py

      - name: Export script'ini çalıştır
        run: python scripts/export_fon_kartlari.py

      - name: Değişiklikleri repoya kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add benchmarklar.parquet docs/data/fon-kartlari
          git diff --cached --quiet && echo "Değişiklik yok, commit atılmadı." || git commit -m "Benchmark boşluklarını kapat ve fon kartlarını güncelle"
          git pull --rebase origin main
          git push

      - name: Sonucu incele
        run: python diagnose_benchmarks.py
