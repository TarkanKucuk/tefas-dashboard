name: Kontrol

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli kütüphaneleri kur
        run: pip install pandas numpy pyarrow openpyxl

      - name: Export script'ini çalıştır
        run: python scripts/export_fon_kartlari.py

      - name: Üretilen JSON'ları repoya kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/fon-kartlari
          git diff --cached --quiet && echo "Değişiklik yok, commit atılmadı." || git commit -m "Fon kartı verilerini güncelle"
          git pull --rebase origin main
          git push
