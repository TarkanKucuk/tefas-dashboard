name: Kontrol

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli kütüphaneleri kur
        run: pip install pandas numpy pyarrow openpyxl tefasfon

      - name: Varlık dağılımı verisini güncelle (günlük, tek tek)
        run: python scripts/update_portfoy.py

      - name: Fon kartı JSON'larını yeniden üret
        run: python scripts/export_fon_kartlari.py

      - name: Değişiklikleri repoya kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add tefas_portfoy_dagilim.parquet docs/data/fon-kartlari
          git diff --cached --quiet && echo "Değişiklik yok, commit atılmadı." || git commit -m "Varlık dağılımını güncelle ve fon kartlarını yeniden üret"
          git pull --rebase origin main
          git push

      - name: Sonucu incele
        run: python diagnose_portfoy.py
