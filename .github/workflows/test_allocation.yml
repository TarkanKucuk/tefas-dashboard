name: TEST Portfoy Dagilimi Denemesi

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: |
          pip install "borsapy[allocation]" playwright
          playwright install --with-deps chromium

      - name: Fon bazli deneme (PBR/PHE/TLY)
        run: python scripts/test_allocation.py

      - name: Toplu sayfa denemesi (fon-verileri)
        run: python scripts/test_bulk_distribution.py
        continue-on-error: true

      - name: Ekran goruntusunu kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deneme-ekran-goruntusu
          path: deneme_ekran_goruntusu.png
          if-no-files-found: warn
