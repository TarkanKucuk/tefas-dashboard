name: TEST Portfoy Dagilimi Denemesi

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: |
          pip install "borsapy[allocation]"
          playwright install --with-deps chromium

      - name: Test calistir
        run: python scripts/test_allocation.py
