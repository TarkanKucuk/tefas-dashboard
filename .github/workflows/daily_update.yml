name: TEFAS Gunluk Guncelleme
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklari kur
        run: pip install -r requirements.txt
      - name: Veriyi guncelle
        run: |
          for deneme in 1 2 3 4 5 6; do
            echo "Deneme $deneme/6..."
            if python scripts/update_data.py; then
              echo "Basarili."
              break
            fi
            if [ "$deneme" -eq 6 ]; then
              echo "6 denemeden sonra basarisiz oldu, workflow durduruluyor."
              exit 1
            fi
            echo "Basarisiz oldu, 5 dakika beklenip tekrar denenecek..."
            sleep 300
          done
      - name: Karsilastirma verilerini guncelle (USD/EUR/BIST100/Altin)
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python scripts/update_benchmarks.py
      - name: Fon bilgilerini guncelle (stopaj/yonetim ucreti)
        run: python scripts/update_fon_bilgileri.py
      - name: TEFAS'a acik fon listesini guncelle
        run: python scripts/update_tefas_durum.py
      - name: Puanlama sistemini calistir
        run: python scripts/score_funds.py
      - name: Skor gecmisi arsivini guncelle
        run: python scripts/update_skor_gecmisi.py
      - name: Portfoy dagilim verisini guncelle
        run: python scripts/update_portfoy.py
      - name: Fon karti JSON'larini yeniden uret
        run: python scripts/export_fon_kartlari.py
      - name: Degisiklikleri kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in tefas_gecmis_veri.parquet benchmarklar.parquet fon_bilgileri.parquet tefas_portfoy_dagilim.parquet tefas_acik_fonlar.parquet skor_gecmisi.parquet; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "Uyari: $f bulunamadi, atlaniyor (o gunku ilgili script basarisiz olmus olabilir)."
            fi
          done
          git add docs/
          git diff --quiet --cached || git commit -m "Otomatik guncelleme"
          git push
