name: ALE Teshis (Bir Kerelik)
on:
  workflow_dispatch: {}
jobs:
  teshis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklari kur
        run: pip install -r requirements.txt
      - name: ALE fonunu teshis et
        run: python scripts/diagnose_ale.py
