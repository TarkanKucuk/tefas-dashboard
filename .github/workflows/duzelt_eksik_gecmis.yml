name: Eksik Gecmis Toplu Duzeltme (Bir Kerelik)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  duzelt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklari kur
        run: pip install -r requirements.txt
      - name: Eksik gecmisi topluca doldur
        run: python scripts/duzelt_eksik_gecmis.py
      - name: Degisiklikleri kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -f "tefas_gecmis_veri.parquet" ]; then
            git add tefas_gecmis_veri.parquet
          fi
          git diff --quiet --cached || git commit -m "Eksik gecmis toplu duzeltme (17 Temmuz oncesi)"
          git push
